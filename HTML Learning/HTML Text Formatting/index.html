<!DOCTYPE html>
<html>
    <head>
        <title>HTML Text Formatting</title>
    </head>
    <body>
        <h1>HTML Text Formatting</h1>
        <p><b>This Is Bold</b></p>
        <p><i>This Is Italic</i></p>
        <p><em>This Is Emphasized</em></p>
        <p><u>This Is Underline</u></p>
        <p><mark>This Is Highlighted</mark></p>
        <p><small>This Is Small</small></p>
        <p><del>This is Deleted</del></p>
        <p><ins>This Is Inserted</ins></p>
        <p>H<sub>2</sub>0</p>
        <p>10<sup>2</sup></p>
    </body>
</html>
