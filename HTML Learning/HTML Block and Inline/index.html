<!DOCTYPE html>
<html>
    <head>
        <title>Block vs Inline</title>
    </head>
    <body>
        <h1>Block Element</h1>
        <div>Hello</div>
        <div>World</div>
        <p>First Paragraph</p>
        <p>Second Paragraph</p>

        <h1>inline Element</h1>
        <span>Hello</span>
        <span>World</span>
        <b>HTML</b>
        <i>CSS</i>
        <h1><a href="https://www.google.com">Google</a></h1>   
    </body>
    
</html>
