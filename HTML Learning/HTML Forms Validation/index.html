<!DOCTYPE html>
<html>
    <head>
        <title>Forms And Validation</title>
    </head>
    <body>
        <h1>Registration Form</h1>
        
    <form>
        <label for="username">Name:</label>
        <input type="text"  placeholder="Enter Your Name " id="username" name="Username" required minlength="3" maxlength="20">
          
        <br><br>

        <label for="Email">Email:</label>
        <input type="email" placeholder="Enter Your Email" id="Email" name="email" required>
        
        <br><br>
        
        <label for="Password">Password:</label>
        <input type="password" placeholder="Enter Your Password" id="Password" name="password" required minlength="8" maxlength="12">
         
        <button type="submit">Register</button>
    </form>    
    </body>
</html>
